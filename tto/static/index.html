<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TTO Masa v2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233987e5'/%3E%3Cpath d='M6 22l6-7 5 4 9-11' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/app.css">
<script>
(function () {
  try {
    var t = localStorage.getItem('tto.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* storage unavailable: default theme */ }
})();
</script>
</head>
<body>
<div id="login" class="hidden">
  <form class="box" id="login-form" autocomplete="on">
    <div class="brand" style="padding:0"><div class="logo">TTO</div><div class="txt"><div class="name">TTO Masa v2</div><div class="sub">TRY · USD faiz masası</div></div></div>
    <h1 id="login-title">Giriş</h1>
    <p id="login-hint">İsminiz ve şifrenizle girin.</p>
    <input id="login-name" name="username" maxlength="40" placeholder="İsim" autocomplete="username" autofocus>
    <input id="login-pass" name="password" type="password" maxlength="200" placeholder="Şifre" autocomplete="current-password">
    <input id="login-pass2" name="password2" type="password" maxlength="200" placeholder="Şifre (tekrar)" autocomplete="new-password" class="hidden">
    <input id="login-note" name="note" maxlength="200" placeholder="Not (isteğe bağlı): kim olduğunuz, masanız" class="hidden">
    <div class="errtxt" id="login-err"></div>
    <div class="oktxt" id="login-ok"></div>
    <button class="btn primary" type="submit" id="login-submit">Giriş</button>
    <div class="login-links"><a href="#" id="login-switch">Hesabınız yok mu? Hesap isteyin</a></div>
  </form>
</div>

<div id="app" class="hidden">
  <aside id="side">
    <div class="brand"><div class="logo">TTO</div><div class="txt"><div class="name">TTO Masa v2</div><div class="sub">TRY · USD faiz</div></div></div>
    <nav id="nav"></nav>
    <div class="nav-foot">
      <button class="btn ghost sm" id="btn-collapse" title="Menüyü daralt / genişlet">⇤</button>
      <span class="lbl muted" id="foot-ver"></span>
    </div>
  </aside>
  <section id="main">
    <header id="top">
      <h1 id="page-title">&nbsp;</h1>
      <button class="favstar" id="btn-fav" type="button" title="Bu sayfayı üst şeritteki favorilerinize ekleyin / çıkarın">☆</button>
      <nav class="favs" id="favs" aria-label="Favori sayfalar"></nav>
      <button class="badge" id="mode-badge" type="button"><span class="led"></span><span id="mode-text">…</span></button>
      <button class="badge interp hidden" id="interp-badge" type="button"><span class="led"></span><span id="interp-text">Eğri: PPK basamak</span></button>
      <span class="muted" id="asof"></span>
      <button class="btn desk-alarm hidden" id="desk-alarm" type="button"></button>
      <button class="btn hesap hidden" id="hesap-ind" type="button"></button>
      <span class="spacer"></span>
      <span class="findbox" id="findbox"><input class="inp" id="find" type="search" autocomplete="off" spellcheck="false"
        placeholder="Tablo / hesaplayıcı bul  (Ctrl+K)" title="Bütün sayfalardaki tabloları adıyla arayın: “interest”, “xautry”, “dv01” … Enter ile gidin. Komutlar da: “ret yayınla”, “işlem gir usdtry 1m 10mn”, “trade ois 1y 5mn”, “kâğıt ekle TRT…”, “senaryo S2”, “sayfa ois”, “launchpad Sabah” – hiçbiri kendiliğinden kaydetmez"></span>
      <button class="btn" id="btn-ret" title="RET faizlerini gir, değiştir (tek tek ya da baz puanla kaydır), Excel'den yapıştır, göndermek için kopyala">RET faizleri<span class="retupd hidden" id="ret-upd" role="button" tabindex="0"></span></button>
      <button class="btn" id="btn-scen" title="Senaryolarım">Senaryolar</button>
      <button class="btn" id="btn-drawer" type="button" aria-pressed="false" aria-label="Yan panel" title="Yan panel: sabitlediğiniz tablolar her sayfada sağda (Alt+Y)">◨<span class="n" id="dr-count"></span></button>
      <!-- the number format, the flashing and the theme: in the user's menu (#btn-user: #btn-lang, #btn-flash, #btn-theme) -->
      <button class="btn" id="btn-feedback" type="button" title="Hata bildirin ya da öneri gönderin (yöneticilere gider)">Hata / Öneri<span class="fb-alert hidden" id="fb-alert" aria-label="açık bildirim var">!</span></button>
      <button class="btn prop-btn" id="prop-btn" type="button" aria-haspopup="dialog" aria-expanded="false" title="Prop: parite, stop ve kayıptan 1M'e aşağı yuvarlanmış büyüklük ve gerçek kayıp; Trades sekmesinin stoplardaki kaybı, bugünkü K/Z ve günlük limitten kalan alan - yalnız görmek için">Prop</button>
      <button class="prchip hidden" id="presence-chip" type="button" aria-haspopup="dialog" aria-expanded="false"><span class="pr-led"></span><b id="presence-n">0</b><span class="pr-word"> çevrimiçi</span></button>
      <button class="userchip" id="btn-user" title="Kullanıcı değiştir"><span class="av" id="user-av">?</span><span id="user-name"></span></button>
    </header>
    <div id="kpis"></div>
    <main id="content" tabindex="-1"></main>
    <footer id="statusbar">
      <span class="addr" id="sb-addr">—</span>
      <span class="fx" id="sb-fx"></span>
      <span class="stat" id="sb-stat"></span>
      <span class="hint" id="sb-hint">Ctrl+C kopyala · Ctrl+V yapıştır · Enter düzenle</span>
    </footer>
  </section>
  <aside id="drawer" class="hidden" aria-label="Yan panel">
    <header class="dr-head">
      <b>Yan panel</b>
      <span class="muted">sabitlediğiniz tablolar · her sayfada</span>
      <span class="spacer"></span>
      <button class="iconbtn" id="dr-wide" type="button" title="Yan paneli genişlet / daralt">⇔</button>
      <button class="iconbtn" id="dr-close" type="button" title="Kapat (Alt+Y)">✕</button>
    </header>
    <div class="dr-empty muted" id="dr-empty"></div>
    <div class="dr-list" id="dr-list"></div>
  </aside>
</div>
<div id="toasts"></div>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
